<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style_cadastre.css">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/assets/infinity.png">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <title>Cadastrar-se</title>

</head>
<body class="bg-black">

  <!-- ELEMENTOS DE LUZ NEON AO FUNDO -->
  <div class="glow-bg-top-left"></div>
  <div class="glow-bg-bottom-right"></div>

  <!-- CONTAINER PRINCIPAL -->
  <div class="container-fluid p-0 login-container">
    <div class="row g-0">
      
      <!-- COLUNA DA ESQUERDA (Banner Sem o bloco de badges) -->
      <div class="col-lg-6 hero-side d-lg-flex">
        
      </div>

      <!-- COLUNA DA DIREITA (Formulário de Cadastro) -->
      <div class="col-lg-6 form-side">
        
        <!-- Header com Logo da Infinity School -->
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="d-flex align-items-center gap-2">
            <!-- LOGO INFINITY SCHOOL -->
            <div class="brand-logo-container">
              <img src="/assets/Logo padrão.png" alt="Infinity School Logo" class="brand-logo-img">
            </div>
            
          </div>
          <!-- Link Voltar tela inicial -->
                <a href="/index.html"class="btn btn-outline-secondary btn-sm rounded-pill text-white border-secondary border-opacity-50 mb-3 mt-3">
                    <i class="bi bi-arrow-left text-danger me-1"></i> Voltar tela inicial
                </a>
        </div>

        <!-- Título principal -->
        <h3 class="fw-bold mb-1">Criar sua Conta</h3>
        <p class="text-custom-muted small mb-4">Preencha seus dados para começar a cadastrar seus projetos</p>

        <!-- Formulário de Cadastro -->
        <form id="registerForm">
          
          <!-- Botão SSO Google -->
          <button type="button" class="btn btn-google w-100 d-flex align-items-center justify-content-center gap-2 mb-3">
            <svg width="18" height="18" viewBox="0 0 24 24">
              <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.2 9 5 12 5z"/>
              <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.7-.2-2.3H12v4.6h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.9z"/>
              <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 10.8 0 12.5s.7 2.8 1.9 5.2l3.7-2.9z"/>
              <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.2-6.4-5.2L1.9 16C3.7 19.7 7.5 23 12 23z"/>
            </svg>
            Cadastrar com Google
          </button>

          <!-- Divisor -->
          <div class="divider">
            <span>● OU COM E-MAIL ●</span>
          </div>

          <!-- Campo: Nome Completo -->
          <div class="mb-3">
            <label for="fullName" class="form-label">Nome Completo</label>
            <div class="input-group custom-input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input type="text" id="fullName" class="form-control" placeholder="Digite seu nome completo" required>
            </div>
          </div>

          <!-- Campo: E-mail -->
          <div class="mb-3">
            <label for="studentEmail" class="form-label">E-mail do Aluno</label>
            <div class="input-group custom-input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email" id="studentEmail" class="form-control" placeholder="aluno@escola.com ou seu email" required>
            </div>
          </div>

          <!-- Campo: Senha -->
          <div class="mb-3">
            <label for="passwordInput" class="form-label">Senha</label>
            <div class="input-group custom-input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" id="passwordInput" class="form-control" placeholder="Crie uma senha segura" required>
              <span class="input-group-text border-0 bg-transparent text-custom-muted">
                <i class="bi bi-eye"></i>
              </span>
            </div>
          </div>

          <!-- Campo: Confirmar Senha -->
          <div class="mb-3">
            <label for="confirmPasswordInput" class="form-label">Confirmar Senha</label>
            <div class="input-group custom-input-group">
              <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
              <input type="password" id="confirmPasswordInput" class="form-control" placeholder="Repita sua senha" required>
            </div>
          </div>

          <!-- Botão Cadastrar -->
          <button type="submit" class="btn btn-primary-red w-100 mb-4">
            Cadastrar no Portfólio <i class="bi bi-arrow-right ms-2"></i>
          </button>

          <!-- Rodapé de Login -->
          <p class="text-center small text-custom-muted mb-4">
            Já possui uma conta? <a href="/paginas/login.html" class="link-red fw-bold">Fazer Login</a>
          </p>

          <!-- Ícones Redes Sociais -->
          <div class="d-flex justify-content-center gap-3">
            <a href="#" class="social-btn" aria-label="GitHub"><i class="bi bi-github"></i></a>
            <a href="#" class="social-btn" aria-label="LinkedIn"><i class="bi bi-linkedin"></i></a>
            <a href="#" class="social-btn" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
          </div>

        </form>

      </div>

    </div>
  </div>

</body>
</html>
